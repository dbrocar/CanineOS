<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FRESHBOWL METHOD — whole food rotation feeding for dogs</title>
<meta name="theme-color" content="#2e7d52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FRESHBOWL METHOD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:linear-gradient(180deg,#eaf5ee,#d4edda);background-attachment:fixed;color:#1d3a2a;font-family:'Baloo 2',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
.header{background:#ffffff;padding:14px 20px 0;border-bottom:1px solid rgba(46,125,82,0.25);position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:12px;}
.pet-photo-box{flex-shrink:0;width:76px;height:76px;border-radius:16px;background:#ffffff;border:1px solid rgba(46,125,82,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
.pet-photo-box input[type="file"]{display:none;}
.pet-photo-placeholder{font-size:32px;opacity:0.5;}
.pet-photo-box img{width:100%;height:100%;object-fit:cover;}
.app-title{font-size:32px;font-weight:800;color:#2e7d52;line-height:1.1;letter-spacing:3px;}
.app-tagline{font-size:14px;font-weight:600;color:#6a8c72;letter-spacing:0.5px;margin-top:1px;}
.version-tag{font-size:12px;font-weight:400;color:#6a8c72;vertical-align:middle;letter-spacing:0;}
.back-home-btn{flex-shrink:0;background:#eaf5ee;border:1px solid rgba(46,125,82,0.35);border-radius:12px;color:#1d3a2a;font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:700;padding:8px 12px;cursor:pointer;}
.back-home-btn:active{transform:scale(0.96);}
.back-home-spacer{flex-shrink:0;width:72px;}
.autosave-pill{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(10px);background:#1d3a2a;color:#fff;font-family:'Baloo 2',sans-serif;font-size:14px;font-weight:700;padding:7px 16px;border-radius:99px;box-shadow:0 4px 14px rgba(29,58,42,0.35);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:9999;}
.autosave-pill.show{opacity:1;transform:translateX(-50%) translateY(0);}
.home-profile-card{background:#ffffff;border:1px solid rgba(46,125,82,0.3);border-radius:20px;padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:12px;box-shadow:0 3px 10px rgba(29,58,42,0.08);}
.home-profile-photo{flex-shrink:0;width:130px;height:130px;border-radius:22px;background:#eaf5ee;border:2px solid rgba(46,125,82,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
.home-profile-photo input[type="file"]{display:none;}
.home-profile-photo .pet-photo-placeholder{font-size:46px;opacity:0.5;}
.home-profile-photo img{width:100%;height:100%;object-fit:cover;}
.home-profile-info{flex:1;min-width:0;}
.home-profile-info .pet-name-input{font-size:22px;font-weight:700;}
.home-profile-sub{font-size:13px;color:#6a8c72;line-height:1.5;margin-top:4px;}
.home-profile-edit{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:#2e7d52;cursor:pointer;background:none;border:none;font-family:'Baloo 2',sans-serif;padding:0;}
.dog-switch-row{display:flex;flex-wrap:wrap;gap:7px;margin:-4px 0 12px;}
.dog-chip{background:#ffffff;border:1px solid rgba(46,125,82,0.35);border-radius:99px;padding:6px 13px;font-family:'Baloo 2',sans-serif;font-size:14px;font-weight:700;color:#4a6a7d;cursor:pointer;}
.dog-chip.active{background:#2e7d52;border-color:#2e7d52;color:#fff;}
.dog-chip.add{border-style:dashed;color:#6a8c72;background:transparent;}
/* Active-dog header banner (multi-dog only) */
.active-dog-banner{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(90deg,rgba(46,125,82,0.11),rgba(46,125,82,0.06));
  border-top:1px solid rgba(46,125,82,0.20);
  padding:5px 16px 6px;
  font-size:13px;font-weight:800;color:#2e7d52;letter-spacing:0.2px;
}
/* ── Drum / Scroll-Snap Picker ─────────────────────────────────────────── */
.drum-section{margin-bottom:18px;}
.drum-section-label{font-size:12px;font-weight:700;color:#6a8c72;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.drum-row{display:flex;gap:10px;align-items:flex-start;}
.drum-col{flex:1;display:flex;flex-direction:column;align-items:center;}
.drum-col-label{font-size:11px;font-weight:700;color:#6a8c72;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;}
.drum-wrap{position:relative;width:100%;height:120px;overflow:hidden;border-radius:14px;background:#ffffff;box-shadow:0 2px 10px rgba(29,58,42,.10);border:1px solid rgba(46,125,82,.18);}
.drum-wrap::before,.drum-wrap::after{content:'';position:absolute;left:0;right:0;height:38px;z-index:2;pointer-events:none;}
.drum-wrap::before{top:0;background:linear-gradient(to bottom,rgba(255,255,255,.96) 0%,rgba(255,255,255,0) 100%);}
.drum-wrap::after{bottom:0;background:linear-gradient(to top,rgba(255,255,255,.96) 0%,rgba(255,255,255,0) 100%);}
.drum-sel-line{position:absolute;top:50%;left:10%;right:10%;height:1px;background:rgba(46,125,82,.30);transform:translateY(-20px);z-index:3;pointer-events:none;}
.drum-sel-line+.drum-sel-line{transform:translateY(19px);}
.drum-picker{height:120px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:1;}
.drum-picker::-webkit-scrollbar{display:none;}
.drum-item{scroll-snap-align:center;height:40px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:600;color:#1d3a2a;transition:color .15s,transform .15s;}
.drum-item.dp-pad{color:transparent;pointer-events:none;user-select:none;}
/* ── Macro Donut Chart ──────────────────────────────────────────────────── */
.donut-wrap{display:flex;align-items:center;gap:16px;padding:14px 0 10px;}
.donut-svg{flex-shrink:0;}
.donut-legend{display:flex;flex-direction:column;gap:6px;flex:1;}
.donut-row{display:flex;align-items:center;gap:7px;font-size:13px;}
.donut-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.donut-label{color:#1d3a2a;font-weight:600;flex:1;}
.donut-val{color:#6a8c72;font-size:12px;}
/* Print styles */
@media print{
  .no-print{display:none!important;}
  body{background:#fff;color:#000;}
  .print-meal-plan{max-width:700px;margin:0 auto;font-family:sans-serif;}
  .print-week{page-break-inside:avoid;margin-bottom:24px;}
  .print-week h3{font-size:14px;font-weight:700;margin-bottom:8px;border-bottom:1px solid #ccc;padding-bottom:4px;}
  .print-day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .print-day{border:1px solid #ddd;border-radius:6px;padding:6px 4px;text-align:center;font-size:11px;}
  .print-day-label{font-weight:700;font-size:10px;color:#555;margin-bottom:3px;}
  .print-am{font-weight:600;margin-bottom:2px;}
  .print-pm{color:#777;}
  .print-disclaimer{font-size:10px;color:#888;margin-top:20px;border-top:1px solid #eee;padding-top:10px;line-height:1.5;}
}
.pet-info-box{background:#eaf5ee;border:1px solid rgba(46,125,82,0.25);border-radius:12px;padding:8px 12px 6px;margin-bottom:2px;}
.pet-name-input{display:block;width:100%;background:transparent;border:none;border-bottom:1px solid rgba(46,125,82,0.3);color:#2e7d52;font-size:15px;font-weight:600;padding:3px 0 5px;margin-bottom:4px;}
.pet-name-input::placeholder{color:#6a8c72;opacity:0.7;}
.app-sub{font-size:12px;color:#6a8c72;margin-bottom:2px;}
.tabs{display:flex;}
.tab{flex:1;padding:9px 2px;font-size:13px;font-weight:600;color:#6a8c72;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;letter-spacing:.2px;}
.tab.active{color:#2e7d52;border-bottom-color:#2e7d52;}
.page{padding:14px;padding-bottom:80px;display:none;}
.page.active{display:block;}
/* Plan tab */
.section-title{font-size:15px;font-weight:700;color:#2e7d52;margin-bottom:10px;margin-top:4px;}
.aafco-group{margin-bottom:14px;}
.ratio-note{font-size:12px;color:#6f8ea0;background:rgba(46,125,82,0.08);border-radius:8px;padding:9px 10px;margin-top:6px;line-height:1.5;}
.ratio-note strong{color:#2e7d52;}
.aafco-group-label{font-size:12px;font-weight:700;color:#4a6a7d;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.aafco-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.aafco-cell{background:#ffffff;border-radius:7px;padding:7px 9px;}
.aafco-cell-name{font-size:12px;color:#5b7d90;margin-bottom:2px;}
.aafco-cell-val{font-size:14px;font-weight:700;color:#1d3a2a;}
/* Rotation */
.rotation-week{background:#ffffff;border-radius:12px;padding:12px;margin-bottom:10px;}
.rotation-week-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.rotation-week-title{font-size:15px;font-weight:700;color:#1d3a2a;}
.fish-badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(33,150,243,0.2);color:#64b5f6;}
.rotation-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;}
.day-cell{flex-shrink:0;width:44px;border-radius:8px;padding:6px 4px;text-align:center;}
.day-cell.land{background:#eaf5ee;}
.day-cell.fish{background:rgba(33,150,243,0.15);border:1px solid rgba(100,181,246,0.3);}
.day-cell-name{font-size:11px;font-weight:700;color:#5b7d90;margin-bottom:4px;}
.day-cell-am{font-size:11px;color:#1d3a2a;line-height:1.3;margin-bottom:2px;}
.day-cell-pm{font-size:11px;color:#5b7d90;line-height:1.3;}
.fish-icon{font-size:13px;}
/* Calendar */
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;background:#ffffff;border-radius:12px;padding:11px 14px;}
.nav-btn{background:rgba(46,125,82,0.15);border:1px solid rgba(46,125,82,0.3);color:#2e7d52;border-radius:8px;padding:7px 16px;font-size:22px;cursor:pointer;line-height:1;}
.date-center{text-align:center;}
.date-main{font-size:17px;font-weight:700;}
.date-sub{font-size:12px;color:#5b7d90;margin-top:2px;}
.meal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.meal-card{background:#ffffff;border:1px solid rgba(46,125,82,0.2);border-radius:12px;padding:11px;}
.meal-card.fed{background:#e3f5e6;border-color:rgba(76,175,80,0.4);}
.slot-label{font-size:11px;font-weight:700;color:#6a8c72;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;}
.meal-protein{font-size:15px;font-weight:700;margin-bottom:3px;line-height:1.3;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.meal-details{font-size:12px;color:#5b7d90;line-height:1.6;}
.oz-tag{font-size:13px;color:#6a8c72;font-weight:400;}
.amt-tag{cursor:pointer;border-bottom:1px dotted #2e7d52;color:#2e7d52;padding-bottom:1px;}
.recipe-list{margin-top:4px;}
.recipe-line{font-size:12px;color:#6f8ea0;line-height:1.7;display:flex;justify-content:space-between;}
.recipe-line.supp{color:#6a8c72;font-style:italic;}
.supp-check-row{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:#6f8ea0;font-style:italic;line-height:1.5;padding:3px 0;cursor:pointer;}
.supp-check-row input{margin-top:1px;width:13px;height:13px;accent-color:#2e7d52;flex-shrink:0;cursor:pointer;}
.recipe-divider{height:1px;background:rgba(29,58,42,0.10);margin:6px 0;}
.addl-box{background:#ffffff;border:1px solid rgba(46,125,82,0.2);border-radius:12px;padding:13px;margin-top:10px;}
.addl-title{font-size:13px;font-weight:700;color:#2e7d52;letter-spacing:.3px;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.step-num{flex-shrink:0;width:16px;height:16px;border-radius:50%;background:#2e7d52;color:#0f1720;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.addl-title .step-num{background:#2e7d52;color:#0f1720;}
.addl-list{margin-bottom:8px;}
.addl-item{font-size:13px;color:#1d3a2a;padding:4px 0;border-bottom:1px solid rgba(29,58,42,0.10);}
.addl-empty{font-size:13px;color:#4a6a7d;margin-bottom:8px;}
.addins-btn{width:100%;margin-top:7px;padding:6px 0;background:transparent;border:1px solid rgba(46,125,82,0.35);color:#2e7d52;border-radius:7px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.swap-note{font-size:11px;color:#ff9800;margin-bottom:4px;font-style:italic;}
.swap-option{padding:14px 8px;background:#eaf5ee;border-radius:12px;font-size:14.5px;color:#1d3a2a;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;min-height:52px;}
.swap-option.active{border:1px solid #2e7d52;background:rgba(46,125,82,0.1);color:#2e7d52;font-weight:700;}
.swap-options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.swap-sched-tag{font-size:11px;color:#6a8c72;font-weight:400;}
.fed-btn{width:100%;margin-top:7px;padding:8px 0;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;background:#2e7d52;color:#0f1720;}
.fed-btn.active{background:#4caf50;color:#fff;}
/* Nutrition */
.summary-box{background:#ffffff;border-radius:12px;padding:13px;margin-bottom:10px;}
.summary-title{font-size:15px;font-weight:700;margin-bottom:3px;}
.summary-sub{font-size:12px;color:#5b7d90;margin-bottom:8px;}
.pill-row{display:flex;gap:7px;flex-wrap:wrap;}
.s-pill{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;}
.n-card{background:#ffffff;border-radius:9px;padding:11px;margin-bottom:7px;cursor:pointer;}
.n-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.n-name{font-size:14px;font-weight:700;}
.n-val{font-size:12px;}
.n-pill{display:inline-block;padding:2px 6px;border-radius:99px;font-size:11px;font-weight:700;margin-left:5px;}
.bar-bg{height:5px;background:#e7f1f7;border-radius:3px;margin-bottom:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.n-range{font-size:11px;color:#4a6a7d;}
/* Guide */
.guide-card{background:#ffffff;border-radius:12px;padding:14px;margin-bottom:10px;}
.guide-title{font-size:16px;font-weight:700;color:#2e7d52;margin-bottom:10px;}
.guide-title.collapsible-title{cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:0;}
.guide-title.collapsible-title.is-collapsed{margin-bottom:0;}
.collapse-arrow{font-size:13px;color:#5b7d90;margin-left:10px;flex-shrink:0;transition:transform 0.2s;}
.collapsible-content{margin-top:10px;}
.collapsible-content.is-hidden{display:none;}
.guide-section{font-size:11px;font-weight:700;color:#4a6a7d;letter-spacing:1px;text-transform:uppercase;margin-top:10px;margin-bottom:5px;}
.guide-item{font-size:14px;color:#4a6a7d;line-height:1.9;padding-left:4px;}
.guide-item.warn{color:#ff9800;}
.guide-item.avoid{color:#f44336;}
.guide-item.opt{color:#6a8c72;}
.guide-item.safe{color:#4caf50;}
.safety-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px;}
.safety-col{border-radius:99px;padding:8px 7px;}
.safety-col.eat{background:rgba(76,175,80,0.10);}
.safety-col.limit{background:rgba(255,152,0,0.10);}
.safety-col.avoid{background:rgba(244,67,54,0.10);}
.safety-col-title{font-size:12px;font-weight:800;letter-spacing:.5px;text-align:center;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(29,58,42,0.12);}
.safety-col.eat .safety-col-title{color:#4caf50;}
.safety-col.limit .safety-col-title{color:#ff9800;}
.safety-col.avoid .safety-col-title{color:#f44336;}
.safety-item{font-size:11.5px;line-height:1.7;color:#4a6a7d;}
/* Protein picker */
.protein-pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.protein-pick-item{display:flex;align-items:center;gap:8px;padding:9px 10px;background:#eaf5ee;border-radius:8px;border:1px solid rgba(46,125,82,0.15);cursor:pointer;}
.protein-pick-item.checked{border-color:#2e7d52;background:rgba(46,125,82,0.1);}
.protein-pick-item input{width:15px;height:15px;accent-color:#2e7d52;flex-shrink:0;cursor:pointer;}
.protein-pick-item.disabled{opacity:0.35;cursor:not-allowed;}
.protein-pick-name{font-size:13px;color:#1d3a2a;flex:1;}
.protein-pick-fish{font-size:11px;color:#64b5f6;}
.protein-pick-count{font-size:13px;color:#2e7d52;font-weight:700;margin-bottom:8px;}
/* Food safety alert modal (Family-Feud style) */
.safety-alert-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.88);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;}
.safety-alert-box{background:#ffffff;border-radius:18px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 0 0 3px rgba(244,67,54,0.4);}
.safety-alert-box.limit-box{box-shadow:0 0 0 3px rgba(255,152,0,0.4);}
.safety-x{font-size:66px;line-height:1;margin-bottom:6px;animation:safetyPop 0.35s ease;}
@keyframes safetyPop{0%{transform:scale(0.3);opacity:0;}60%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);}}
.safety-alert-title{font-size:21px;font-weight:900;color:#f44336;letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;}
.safety-alert-title.limit-title{color:#ff9800;}
.safety-alert-food{font-size:17px;font-weight:700;color:#1d3a2a;margin-bottom:8px;}
.safety-alert-reason{font-size:14px;color:#4a6a7d;line-height:1.6;margin-bottom:18px;}
.safety-alert-btns{display:flex;flex-direction:column;gap:8px;}
.safety-btn-cancel{width:100%;padding:12px;background:#4caf50;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.safety-btn-proceed{width:100%;padding:10px;background:transparent;border:1px solid rgba(29,58,42,0.22);border-radius:10px;color:#5b7d90;font-size:13px;cursor:pointer;}
.protein-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(29,58,42,0.10);}
.protein-name{font-size:14px;flex:1;}
.protein-tag{font-size:11px;padding:2px 6px;border-radius:99px;font-weight:700;}
.tag-lean{background:rgba(76,175,80,0.15);color:#4caf50;}
.tag-mod{background:rgba(46,125,82,0.15);color:#2e7d52;}
.tag-high{background:rgba(244,67,54,0.15);color:#f44336;}
.organ-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(29,58,42,0.10);}
.organ-name{font-size:14px;}
.organ-freq{font-size:12px;color:#5b7d90;text-align:right;}
.organ-note{font-size:11px;color:#4a6a7d;text-align:right;}
.calc-formula{font-size:13px;color:#5b7d90;text-align:center;background:#eaf5ee;border-radius:8px;padding:9px;margin-bottom:14px;font-family:'SF Mono',Menlo,monospace;line-height:1.6;}
.prep-step{display:flex;align-items:flex-start;gap:11px;margin-bottom:11px;font-size:15px;color:#1d3a2a;line-height:1.45;}
.prep-step:last-child{margin-bottom:0;}
.prep-num{flex-shrink:0;width:23px;height:23px;border-radius:50%;background:#2e7d52;color:#0f1720;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.calc-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;}
.calc-label{font-size:14px;color:#6a8c72;flex-shrink:0;}
.calc-input{width:80px;padding:8px 10px;background:#eaf5ee;border:1px solid rgba(46,125,82,0.3);border-radius:8px;color:#1d3a2a;font-size:16px;text-align:center;}
.calc-select{flex:1;max-width:230px;padding:8px 10px;background:#eaf5ee;border:1px solid rgba(46,125,82,0.3);border-radius:8px;color:#1d3a2a;font-size:14px;}

.calc-out.highlight{color:#2e7d52;font-weight:700;font-size:15px;}

.usda-key-row{margin-bottom:12px;}
.usda-key-input{width:100%;padding:9px 10px;background:#eaf5ee;border:1px solid rgba(46,125,82,0.3);border-radius:8px;color:#1d3a2a;font-size:14px;margin-bottom:5px;}
.usda-key-hint{font-size:12px;color:#6a8c72;}
.export-row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px;color:#4a6a7d;cursor:pointer;border-bottom:1px solid rgba(29,58,42,0.10);}
.export-row input{width:16px;height:16px;accent-color:#2e7d52;flex-shrink:0;cursor:pointer;}
.select-all-row{border-bottom:1px solid rgba(46,125,82,0.25);margin-bottom:4px;padding-bottom:9px;}
.select-all-row span{color:#2e7d52;}
.usda-key-hint a{color:#2e7d52;}
.usda-search-row{display:flex;gap:8px;margin-bottom:10px;}
.usda-search-input{flex:1;padding:10px 12px;background:#eaf5ee;border:1px solid rgba(46,125,82,0.3);border-radius:8px;color:#1d3a2a;font-size:15px;}
.usda-search-btn{padding:10px 16px;background:#2e7d52;border:none;border-radius:8px;color:#0f1720;font-weight:700;font-size:15px;cursor:pointer;}
.usda-types-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.usda-type-chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid rgba(46,125,82,0.3);background:transparent;color:#5b7d90;cursor:pointer;}
.usda-type-chip.on{background:rgba(46,125,82,0.18);color:#2e7d52;border-color:#2e7d52;}
.usda-status{font-size:13px;color:#5b7d90;margin-bottom:8px;}
.usda-status.err{color:#f44336;}
.usda-result-item{padding:9px 10px;background:#eaf5ee;border-radius:8px;margin-bottom:6px;cursor:pointer;}
.usda-result-name{font-size:14px;color:#1d3a2a;margin-bottom:3px;}
.usda-result-meta{font-size:12px;color:#6a8c72;}
.usda-result-badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700;background:rgba(100,181,246,0.15);color:#64b5f6;margin-left:6px;}
.usda-detail{margin-top:12px;border-top:1px solid rgba(29,58,42,0.12);padding-top:12px;}
.usda-detail-title{font-size:15px;font-weight:700;color:#2e7d52;margin-bottom:8px;}
.usda-nutrient-table{margin-bottom:12px;}
.usda-nutrient-row{display:flex;justify-content:space-between;font-size:13px;color:#6f8ea0;padding:4px 0;border-bottom:1px solid rgba(29,58,42,0.10);}
.usda-snippet{width:100%;min-height:70px;background:#eaf5ee;border:1px solid rgba(46,125,82,0.3);border-radius:8px;color:#4caf50;font-size:13px;font-family:'SF Mono',Menlo,monospace;padding:10px;resize:vertical;margin-bottom:8px;}
.usda-approx-note{font-size:11px;color:#6a8c72;margin-top:6px;line-height:1.5;}
.usda-modal-toggle{font-size:13px;color:#2e7d52;cursor:pointer;margin:12px 0 10px;text-decoration:underline;display:inline-block;}
.usda-modal-panel{background:#eaf5ee;border-radius:10px;padding:12px;margin-bottom:14px;}
/* Disclaimer */
.disclaimer-card{background:#ffffff;border:1px solid rgba(244,67,54,0.35);border-radius:12px;padding:14px;margin-bottom:10px;}
.disclaimer-title{font-size:14px;font-weight:700;color:#f44336;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:7px;}
.disclaimer-body{font-size:13px;color:#4a6a7d;line-height:1.7;}
.disclaimer-body strong{color:#1d3a2a;}
.footer-disclaimer{text-align:center;font-size:11px;color:#4a6a7d;padding:14px 20px 24px;line-height:1.6;}
/* Modal */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:200;display:flex;align-items:flex-end;}
.modal{background:#ffffff;border-radius:16px 16px 0 0;width:100%;padding:20px;max-height:78vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.modal-title{font-size:17px;font-weight:700;color:#2e7d52;}
.modal-close{background:transparent;border:none;color:#5b7d90;font-size:24px;cursor:pointer;line-height:1;}
.modal-hint{font-size:13px;color:#6a8c72;margin-bottom:12px;}
.ai-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid rgba(29,58,42,0.10);}
.ai-name{font-size:15px;flex:1;}
.ai-input{width:56px;padding:6px 8px;background:#eaf5ee;border:1px solid rgba(46,125,82,0.3);border-radius:7px;color:#1d3a2a;font-size:16px;text-align:center;}
.ai-unit{font-size:12px;color:#6a8c72;margin-left:5px;}
.save-btn{width:100%;padding:13px;background:#2e7d52;border:none;border-radius:10px;color:#0f1720;font-size:17px;font-weight:700;cursor:pointer;margin-top:14px;}
.empty-state{text-align:center;padding-top:60px;}
/* History */
.view-toggle{display:flex;gap:6px;margin-bottom:12px;}
.view-btn{flex:1;padding:9px 0;border-radius:9px;border:1px solid rgba(46,125,82,0.3);background:transparent;color:#5b7d90;font-size:14px;font-weight:700;cursor:pointer;}
.view-btn.active{background:#2e7d52;color:#0f1720;border-color:#2e7d52;}
.hist-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;background:#ffffff;border-radius:12px;padding:10px 14px;}
.hist-period-label{font-size:16px;font-weight:700;text-align:center;flex:1;}
.week-day-row{background:#ffffff;border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.week-day-row.today{border:1px solid rgba(46,125,82,0.5);}
.week-day-name{font-size:14px;font-weight:700;color:#1d3a2a;}
.week-meals{display:flex;gap:8px;margin-top:7px;}
.week-meal-pill{flex:1;font-size:12px;padding:6px 8px;border-radius:7px;background:#eaf5ee;color:#5b7d90;}
.week-meal-pill.fed{background:rgba(76,175,80,0.15);color:#4caf50;}
.week-note{margin-top:8px;font-size:13px;color:#2e7d52;padding:7px 9px;background:rgba(46,125,82,0.06);border-radius:7px;cursor:pointer;word-break:break-word;}
.week-addl-line{margin-top:7px;font-size:13px;color:#6f8ea0;padding:6px 9px;background:rgba(29,58,42,0.06);border-radius:7px;}
.day-view-card{background:#ffffff;border-radius:12px;padding:14px;}
.month-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.month-weekday-cell{text-align:center;font-size:12px;color:#6a8c72;font-weight:700;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.month-cell{aspect-ratio:1;background:#ffffff;border-radius:8px;padding:4px;position:relative;cursor:pointer;}
.month-cell.empty{background:transparent;cursor:default;}
.month-cell.today{border:1px solid #2e7d52;}
.month-cell.full-fed{background:rgba(76,175,80,0.12);}
.month-cell.half-fed{background:rgba(255,152,0,0.10);}
.month-cell-day{font-size:13px;font-weight:600;color:#1d3a2a;}
.month-cell-dots{display:flex;gap:3px;margin-top:4px;}
.m-dot{width:5px;height:5px;border-radius:50%;background:#c9d8e0;}
.m-dot.on{background:#4caf50;}
.note-dot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:#2e7d52;}
.year-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mini-month{background:#ffffff;border-radius:10px;padding:8px;cursor:pointer;}
.mini-month-label{font-size:13px;font-weight:700;color:#2e7d52;margin-bottom:5px;text-align:center;}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.mini-cell{aspect-ratio:1;border-radius:2px;background:#eaf5ee;}
.mini-cell.empty{background:transparent;}
.mini-cell.full{background:#4caf50;}
.mini-cell.half{background:#ff9800;}
.dd-label{font-size:12px;font-weight:700;color:#5b7d90;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.dd-protein{font-size:16px;font-weight:700;margin-bottom:2px;}
.dd-detail{font-size:13px;color:#5b7d90;margin-bottom:4px;}
.day-detail-meal{padding:9px 0;border-bottom:1px solid rgba(29,58,42,0.10);}
.note-textarea{width:100%;min-height:90px;background:#eaf5ee;border:1px solid rgba(46,125,82,0.3);border-radius:8px;color:#1d3a2a;font-size:15px;padding:10px;font-family:inherit;resize:vertical;margin-top:8px;}
.hist-divider{height:1px;background:rgba(46,125,82,0.15);margin:22px 0 16px;}
.actual-toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:#6a8c72;margin-bottom:14px;cursor:pointer;}
.actual-toggle input{width:16px;height:16px;accent-color:#2e7d52;}

/* ── App-wide motion polish ─────────────────────────────────────────────── */
@keyframes pageIn{
  0%{ opacity:0; transform:translateY(10px); }
  100%{ opacity:1; transform:translateY(0); }
}
.page.active{ animation:pageIn .32s cubic-bezier(.25,.8,.35,1); }

@keyframes cardPop{
  0%{ opacity:0; transform:translateY(8px) scale(0.98); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}
.guide-card, .meal-card, .n-card, .rotation-week, .day-view-card,
.week-day-row, .month-cell, .addl-box, .summary-box, .disclaimer-card{
  animation:cardPop .3s cubic-bezier(.25,.8,.35,1) both;
}
.guide-card:nth-of-type(2){ animation-delay:.03s; }
.guide-card:nth-of-type(3){ animation-delay:.06s; }
.guide-card:nth-of-type(4){ animation-delay:.09s; }
.guide-card:nth-of-type(5){ animation-delay:.12s; }
.meal-grid .meal-card:nth-child(2){ animation-delay:.05s; }

/* tap feedback across interactive elements */
.tab, .addins-btn, .save-btn, .fed-btn, .nav-btn, .view-btn, .swap-option,
.protein-pick-item, .month-cell, .week-note, .n-card, .usda-result-item,
.export-row, .day-cell{
  transition:transform .15s ease, background .2s ease, border-color .2s ease;
}
.tab:active, .addins-btn:active, .save-btn:active, .fed-btn:active,
.nav-btn:active, .view-btn:active, .swap-option:active, .protein-pick-item:active,
.month-cell:active, .n-card:active, .usda-result-item:active{
  transform:scale(0.96);
}
.fed-btn.active{ animation:fedPulse .4s ease; }
@keyframes fedPulse{
  0%{ transform:scale(1); }
  40%{ transform:scale(1.06); }
  100%{ transform:scale(1); }
}
.tab.active{ animation:tabPop .3s ease; }
@keyframes tabPop{
  0%{ transform:scale(0.92); }
  60%{ transform:scale(1.04); }
  100%{ transform:scale(1); }
}

/* modal entrance */
@keyframes modalUp{
  0%{ transform:translateY(100%); opacity:0.4; }
  100%{ transform:translateY(0); opacity:1; }
}
@keyframes overlayFade{
  0%{ opacity:0; }
  100%{ opacity:1; }
}
.overlay{ animation:overlayFade .2s ease; }
.overlay .modal{ animation:modalUp .32s cubic-bezier(.25,.8,.35,1); }

/* checkbox / bar-fill micro-motion */
.bar-fill{ transition:width .5s cubic-bezier(.25,.8,.35,1); }
.supp-check-row input, .export-row input, .protein-pick-item input{ transition:transform .15s ease; }
.supp-check-row input:active, .export-row input:active{ transform:scale(1.15); }

/* ── Onboarding walkthrough (first-launch carousel) ────────────────────── */
.onb-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.75);
  z-index:400;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  animation:overlayFade .25s ease;
}
.onb-card{
  background:#ffffff;
  border:1px solid rgba(46,125,82,0.3);
  border-radius:20px;
  width:100%;
  max-width:360px;
  padding:26px 22px 22px;
  text-align:center;
  animation:modalUp .35s cubic-bezier(.25,.8,.35,1);
}
.onb-slide-wrap{ position:relative; min-height:230px; }
.onb-slide{
  position:absolute; top:0;left:0;right:0;
  opacity:0; transform:translateX(24px);
  transition:opacity .35s ease, transform .35s ease;
  pointer-events:none;
  display:flex; flex-direction:column; align-items:center;
}
.onb-slide.active{ opacity:1; transform:translateX(0); pointer-events:auto; }
.onb-badge{
  width:34px;height:34px;border-radius:50%;
  background:#2e7d52;color:#0f1720;font-weight:800;font-size:16px;
  display:flex;align-items:center;justify-content:center;margin-bottom:12px;
}
.onb-icon{
  width:80px;height:80px;border-radius:22px;
  background:rgba(46,125,82,0.12);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;margin-bottom:14px;
}
.onb-title{ font-size:18px;font-weight:800;color:#1d3a2a;margin-bottom:8px; }
.onb-desc{ font-size:14.5px;color:#5b7d90;line-height:1.6;max-width:280px; }
.onb-dots{ display:flex;gap:6px;justify-content:center;margin-top:18px;margin-bottom:16px; }
.onb-dot{ width:7px;height:7px;border-radius:50%;background:#cfe0ea;transition:background .25s ease, transform .25s ease; }
.onb-dot.active{ background:#2e7d52;transform:scale(1.3); }
.onb-btns{ display:flex;gap:8px; }
.onb-btn-skip{ flex:1;padding:11px;border-radius:9px;border:1px solid rgba(29,58,42,0.18);background:transparent;color:#5b7d90;font-size:14px;font-weight:700;cursor:pointer; }
.onb-btn-next{ flex:2;padding:11px;border-radius:9px;border:none;background:#2e7d52;color:#0f1720;font-size:15px;font-weight:800;cursor:pointer; }
.replay-walkthrough-btn{ font-size:13px;color:#2e7d52;text-decoration:underline;cursor:pointer;margin-top:10px;display:inline-block; }

/* ── Directional slide transitions (day/history/nutrition navigation) ───── */
@keyframes slideInFromRight{
  0%{ opacity:0; transform:translateX(26px); }
  100%{ opacity:1; transform:translateX(0); }
}
@keyframes slideInFromLeft{
  0%{ opacity:0; transform:translateX(-26px); }
  100%{ opacity:1; transform:translateX(0); }
}
.slide-in-right{ animation:slideInFromRight .32s cubic-bezier(.25,.8,.35,1); }
.slide-in-left{ animation:slideInFromLeft .32s cubic-bezier(.25,.8,.35,1); }

/* ── Feeding tab extra polish ─────────────────────────────────────────────
   Meal cards get a smooth color wash when Fed toggles, and everything that
   pops into a card on swap/amount-change (swap notes, add-item lines) gets
   its own little entrance instead of just appearing. */
.meal-card{ transition:background .3s ease, border-color .3s ease; }
.swap-note, .addl-item{ animation:cardPop .28s cubic-bezier(.25,.8,.35,1) both; }
.recipe-line, .supp-check-row{ animation:cardPop .25s cubic-bezier(.25,.8,.35,1) both; }
.recipe-line:nth-of-type(2){ animation-delay:.02s; }
.supp-check-row:nth-of-type(2){ animation-delay:.03s; }
.supp-check-row:nth-of-type(3){ animation-delay:.06s; }
.supp-check-row:nth-of-type(4){ animation-delay:.09s; }
.supp-check-row:nth-of-type(5){ animation-delay:.12s; }

@keyframes checkPop{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.35); }
  100%{ transform:scale(1); }
}
.supp-check-row input:checked, .export-row input:checked{ animation:checkPop .25s ease; }

@keyframes ozTagPulse{
  0%{ color:#2e7d52; }
  50%{ color:#f0c060; }
  100%{ color:#2e7d52; }
}
.amt-tag:active{ animation:ozTagPulse .3s ease; }

/* ── Onboarding-style visual pass, applied app-wide ───────────────────────
   Rounder, softer cards everywhere (matching the onboarding card's 20px
   radius) plus a reusable "icon chip" treatment — the same rounded amber
   icon box used in the onboarding steps — for card titles across the app. */
.guide-card, .meal-card, .n-card, .summary-box, .addl-box, .rotation-week,
.day-view-card, .week-day-row, .disclaimer-card, .month-cell, .usda-modal-panel,
.aafco-cell, .protein-pick-item, .usda-result-item, .day-cell{
  border-radius:16px;
}
.overlay .modal{ border-radius:22px 22px 0 0; }
.save-btn, .fed-btn, .addins-btn{ border-radius:13px; }
.nav-btn, .view-btn{ border-radius:12px; }
.swap-option{ border-radius:12px; }
.calc-input, .calc-select, .usda-key-input, .usda-search-input{ border-radius:11px; }

.title-icon-row{ display:flex; align-items:center; gap:10px; }
.icon-chip{
  width:34px;height:34px;flex-shrink:0;
  border-radius:11px;
  background:rgba(46,125,82,0.14);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
}
.title-text{ color:inherit; font-weight:inherit; }

.slot-icon-chip{
  width:22px;height:22px;border-radius:8px;
  background:rgba(46,125,82,0.16);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:14px;margin-right:6px;vertical-align:middle;
}

.embedded-video-mount{ margin-bottom:14px; border-radius:14px; overflow:hidden; background:#e7f1f7; }

/* ── Home tab ──────────────────────────────────────────────────────────── */
/* ── Home Dashboard Card ──────────────────────────────────────── */
.home-dash-card{
  background:linear-gradient(135deg,#fdf3e0 0%,#eaf5ee 100%);

  margin-bottom:14px;

.home-dash-meal.fed{ background:rgba(76,175,80,.08); border-color:rgba(76,175,80,.40); }

.home-dash-treat-val{ font-size:13px; font-weight:700; }

}

.embedded-video-frame{ width:100%; border:none; display:block; }

<body>

<div class="header">
  <div class="header-top" style="padding-bottom:12px">

  var TOTAL = 8;

    "Broth Cube", "Starch", "Organ", "Vegetable",
    "Herb Cube", "Protein", "Add-Ins", "Microwave & Serve"
  ];
  var cubeRow = document.getElementById("cubeRow");
  var hand = document.getElementById("hand");
  var heldNumber = document.getElementById("heldNumber");
  var progressLabel = document.getElementById("progressLabel");
  var allSet = document.getElementById("allSet");
  var shelfArea = document.getElementById("shelfArea");
  var bowlInside = document.getElementById("bowlInside");
  var legendGrid = document.getElementById("legendGrid");

  function buildLegend(){
    legendGrid.innerHTML = "";
    for(var i=1;i<=TOTAL;i++){
      var item = document.createElement("div");
      item.className = "legend-item";
      item.id = "legend-"+i;
      item.innerHTML = '<span class="legend-num">'+i+'</span><span class="legend-name">'+STEP_LABELS[i-1]+'</span>';
      legendGrid.appendChild(item);
    }
  }
  function setLegendActive(n){
    for(var i=1;i<=TOTAL;i++){
      var item=document.getElementById("legend-"+i);
      if(!item) continue;
      item.className = "legend-item"+(i===n?" active":"")+(i<n?" done":"");
    }
  }
  buildLegend();

  function buildCubes(){
    cubeRow.innerHTML = "";
    for(var i=1;i<=TOTAL;i++){
      var c = document.createElement("div");
      c.className = "cube";
      c.textContent = i;
      c.id = "cube-"+i;
      cubeRow.appendChild(c);
    }
  }
  function buildBowlChips(){
    bowlInside.innerHTML = "";
    for(var i=1;i<=TOTAL;i++){
      var chip = document.createElement("div");
      chip.className = "bowl-chip";
      chip.textContent = i;
      chip.id = "chip-"+i;
      bowlInside.appendChild(chip);
    }
  }
  buildCubes();
  buildBowlChips();

  function scatterFrost(){
    for(var i=0;i<10;i++){
      var d = document.createElement("div");
      d.className = "frost-dot";
      var size = 3 + Math.random()*4;
      d.style.width = size+"px";
      d.style.height = size+"px";
      d.style.left = (Math.random()*100)+"%";
      d.style.top = (Math.random()*-100)+"px";
      d.style.animationDuration = (8+Math.random()*6)+"s";
      d.style.animationDelay = (Math.random()*6)+"s";
      shelfArea.appendChild(d);
    }
    var flakes = ["❄","❆","✻"];
    for(var j=0;j<6;j++){
      var f = document.createElement("div");
      f.className = "snowflake";
      f.textContent = flakes[Math.floor(Math.random()*flakes.length)];
      f.style.left = (Math.random()*100)+"%";
      f.style.top = (Math.random()*-200)+"px";
      f.style.animationDuration = (11+Math.random()*8)+"s";
      f.style.animationDelay = (Math.random()*8)+"s";
      shelfArea.appendChild(f);
    }
  }
  scatterFrost();

  function cubeCenterPercent(n){
    var cube = document.getElementById("cube-"+n);
    if(!cube) return 50;
    var boxRect = document.querySelector(".box-wrap").getBoundingClientRect();
    var cubeRect = cube.getBoundingClientRect();
    var centerX = (cubeRect.left + cubeRect.width/2) - boxRect.left;
    return (centerX / boxRect.width) * 100;
  }

  var BOX_HOVER_TOP = 60;   // hand hovering just above the box
  var BOX_GRAB_TOP  = 128;  // hand dipped into the box to grab a cube
  var BOWL_HOVER_TOP = 400; // hand hovering above the bowl
  var BOWL_DROP_TOP  = 440; // hand tipped down to release into the bowl

  var current = 1;

  function setHand(topPx,leftPct,cb,delay){
    hand.style.top = topPx+"px";
    hand.style.left = leftPct+"%";
    setTimeout(cb, delay);
  }

  function runStep(){
    var n = current;
    progressLabel.textContent = "Step "+n+" of "+TOTAL+" — "+STEP_LABELS[n-1];
    setLegendActive(n);
    var cube = document.getElementById("cube-"+n);
    var cubeX = cubeCenterPercent(n);

    // 1. move over the cube
    setHand(BOX_HOVER_TOP, cubeX, function(){
      if(cube) cube.classList.add("active-glow");

      // 2. dip down and grab it
      setHand(BOX_GRAB_TOP, cubeX, function(){
        if(cube){ cube.classList.add("taken"); cube.classList.remove("active-glow"); }
        heldNumber.textContent = n;
        heldNumber.classList.add("show");

        // 3. lift back up, carrying the cube
        setHand(BOX_HOVER_TOP, cubeX, function(){

          // 4. travel over to the bowl
          setHand(BOWL_HOVER_TOP, 50, function(){

            // 5. tip down and release into the bowl
            hand.classList.add("tilt");
            setHand(BOWL_DROP_TOP, 50, function(){
              heldNumber.classList.remove("show");
              var chip=document.getElementById("chip-"+n);
              if(chip) chip.classList.add("show");

              // 6. lift back up, hand upright again
              hand.classList.remove("tilt");
              setHand(BOWL_HOVER_TOP, 50, function(){
                current++;
                if(current > TOTAL){
                  allSet.classList.add("show");
                  setTimeout(function(){
                    allSet.classList.remove("show");
                    buildCubes();
                    buildBowlChips();
                    setLegendActive(0);
                    current = 1;
                    setHand(BOX_HOVER_TOP, 50, runStep, 500);
                  }, 1800);
                } else {
                  runStep();
                }
              }, 450);
            }, 420);
          }, 500);
        }, 380);
      }, 480);
    }, 450);
  }

  setTimeout(runStep, 500);
<\/script>
