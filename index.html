<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canine OS</title>
  <style>
    :root {
      --bg-gradient-start: #eaf5ee;
      --bg-gradient-end: #d4edda;
      --primary-green: #2e7d52;
      --primary-dark: #1b4d31;
      --accent-light: #e0f2e9;
      --card-bg: #ffffff;
      --text-main: #1f2d24;
      --text-muted: #4a6353;
      --border-color: #c3e6cb;
      --shadow: 0 8px 20px rgba(46, 125, 82, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 20px;
      font-size: 1.25rem; /* Scaled for enhanced readability */
      line-height: 1.5;
      min-height: 100vh;
    }

    .app-container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Header Section */
    header {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    header h1 {
      color: var(--primary-green);
      font-size: 2.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Content Cards */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      color: var(--primary-green);
      font-size: 1.5rem;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--accent-light);
      padding-bottom: 8px;
    }

    /* Custom Form & Interactive Elements */
    .btn-primary {
      display: inline-block;
      width: 100%;
      background-color: var(--primary-green);
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      padding: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(46, 125, 82, 0.2);
    }

    .btn-primary:active {
      background-color: var(--primary-dark);
      transform: scale(0.98);
    }

    .badge {
      display: inline-block;
      background: var(--accent-light);
      color: var(--primary-green);
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 1rem;
      margin-top: 8px;
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      
      header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Main Branding Header -->
    <header>
      <h1>CANINE OS</h1>
      <p>Modular Meal & Nutrition Management</p>
      <span class="badge">System Active</span>
    </header>

    <!-- Content Module -->
    <main>
      <section class="card">
        <h2>Daily Prep & Rotation</h2>
        <p>Your custom nutritional guidelines and tracking metrics will load here.</p>
      </section>

      <section class="card">
        <button class="btn-primary" onclick="alert('Canine OS System Ready')">Update Daily Meal Log</button>
      </section>
    </main>
  </div>

</body>
</html>
